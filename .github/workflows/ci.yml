name: Workspace checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: npm ci
      - run: make check
      - run: python3 -m pip install --disable-pip-version-check ruff==0.15.12
      - run: make python-check
